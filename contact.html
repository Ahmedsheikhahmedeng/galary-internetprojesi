<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@200;300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="contact.css">
    <script src="theme.js"></script>
</head>

<body class="tema-acik">

    <main class="contact-container">

        <div class="left-col"></div>

        <div class="right-col">

            <div class="top-actions">
                <div class="menu-buton hover-hedef" id="theme-toggle">GECE MODU</div>
                <a href="index.html" class="back-btn">GERİ DÖN</a>
            </div>

            <div class="small-title">İletişim</div>

            <h1>Contact <span>Us</span></h1>

            <p>
                Fotoğraf çekimi, galeri çalışması veya özel projeler için bizimle iletişime geçebilirsin.
            </p>

            <form id="contact-form">

                <label for="name">Ad Soyad</label>
                <input type="text" id="name" placeholder="Adınızı yazın">

                <label for="phone">Telefon</label>
                <input type="tel" id="phone" placeholder="Telefon numaranız">

                <label for="message">Mesaj</label>
                <textarea id="message" rows="5" placeholder="Mesajınızı yazın"></textarea>

                <button type="submit">Gönder</button>

            </form>

            <div id="error"></div>
            <div id="success-msg"></div>

        </div>

    </main>

    <script src="contact.js"></script>
</body>

</html>
